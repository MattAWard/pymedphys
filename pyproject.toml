[project]
name = "pymedphys"
version = "0.42.0-dev0"
description = "Medical Physics library"
readme = "README.rst"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "PyMedPhys Contributors", email = "developers@pymedphys.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
]

# CHANGED: Removed "setuptools" from core deps.
# - setuptools was only needed for pkg_resources; migrate to importlib.metadata/importlib.resources.
# - If you still need setuptools at runtime, add it back with a comment explaining where.
# CHANGED: Kept "tomlkit" as it's used by propagate and config.
# CHANGED: "typing-extensions" retained for backwards compat with Py3.10.
dependencies = [
  "typing-extensions",
  "tomlkit",
]

[project.urls]
Homepage = "https://pymedphys.com"
Repository = "https://github.com/pymedphys/pymedphys"
Documentation = "https://docs.pymedphys.com"

[project.scripts]
pymedphys = "pymedphys.__main__:main"

[project.optional-dependencies]
user = [
  # --- Image processing ---
  # SECURITY: Pillow 10.4.0 -> >=12.1.1 (CVE-2026-25990: PSD OOB write, FITS decompression bombs)
  # BREAKING: Pillow 11.0 dropped Python 3.8 support (fine, we require 3.10+).
  #   Pillow 12.0 removed Image.ANTIALIAS (use Image.LANCZOS instead).
  #   Check all Image.open() + .resize() calls for ANTIALIAS usage.
  "Pillow>=12.1.1",

  "PyYAML",
  "anthropic",
  "anyio",
  "attrs",

  # --- Web framework (dash) ---
  # Dash 3.x is current. Werkzeug CVEs are resolved at >=3.1.0 (transitive).
  "dash>=3.0",

  "dbfread",
  "dicompyler-core",
  "imageio[tifffile]",
  "keyring",
  "matplotlib",
  "natsort",
  "numba",
  "numpy>=1.26",
  "packaging",
  "pandas>=1.0.0",
  "plotly",

  # SECURITY: pydicom 3.0.1 -> >=3.0.2 (CVE-2026-32711: path traversal via DICOMDIR)
  # BREAKING: pydicom 3.0 changed JPEGLossless UID value and default encoding behaviour.
  #   Already on 3.0.x so 3.0.2 is a safe patch bump.
  "pydicom>=3.0.2",

  "pylibjpeg-libjpeg>=1.3.2",
  "pymssql",

  # pynetdicom 3.0 aligns with pydicom 3.0
  "pynetdicom>=3.0",

  # REMOVED: python-dateutil
  # Per CHANGELOG v0.38.0: "dateutil dependency was removed for compatibility
  # reasons with Streamlit's cache. Replaced with pandas equivalents."
  # If any code still imports dateutil, it's a bug to fix, not a dep to keep.

  "pywin32; sys_platform == 'win32' and python_version >= '3.10' and python_version < '3.13'",
  "requests>=2.32.0",
  "scikit-learn",
  "scipy",
  "shapely>=1.7.0",
  "sqlalchemy>=2.0",

  # SECURITY: Streamlit 1.34.0 -> >=1.44.0
  # Fixes: SSRF on Windows (NTLM), path traversal on Windows, and pulls in
  #   patched Tornado >=6.5.5 and Werkzeug >=3.1.0 transitively.
  # BREAKING CHANGES from 1.34 -> 1.44:
  #   1. st.cache -> REMOVED (deprecated since 1.16). Must migrate to:
  #      - @st.cache_data for data-returning functions
  #      - @st.cache_resource for connections/models/global resources
  #      Search codebase: grep -rn "@st.cache\b" lib/pymedphys/
  #   2. st.experimental_dialog -> st.dialog (renamed in 1.37)
  #   3. st.write no longer sets unsafe_allow_html=True for _repr_html_ objects (1.36)
  #   4. Pydantic <2.0 custom validator patch removed (1.41)
  #   5. Experimental cache replay removed from caching decorators (1.41)
  #   6. st._is_running_with_streamlit (private API used in _gui.py) - verify still works
  #   7. st.bokeh_chart removed (1.52) - check if used anywhere
  # Pin upper bound <2.0 to avoid future major breaks.
  "streamlit>=1.44.0,<2.0",

  "timeago",

  # CHANGED: Consider replacing "toml" with tomllib (stdlib 3.11+) + tomlkit.
  # For now keeping it since some code may still import toml directly.
  "toml",

  "tqdm",
  "trio",
  "trio-asyncio",
  "watchdog",
  "xmltodict",
]

dev = [
  "doc8",
  "pre-commit",
  "pyright",
  "readme-renderer",
  "rope",
  "ruff",
  "tabulate",
]

lint = [
  "astroid",
  "pylint",
  "ruff",
]

tests = [
  "anthropic",
  "astroid",
  "imageio",
  "matplotlib",
  "numba",
  "pandas>=1.0.0",
  "Pillow",
  "psutil",
  "pydicom>=3.0.2",
  "pynetdicom>=3.0",
  "PyGithub",
  "pylibjpeg-libjpeg>=1.3.2",
  "pylint",
  # SECURITY: pytest tmpdir vulnerability fixed in >=8.4.0
  "pytest>=8.4.0",
  "pytest-rerunfailures",
  "pytest-sugar",
  # REMOVED: python-dateutil (see note in [user])
  "shapely",
  "tqdm",
]

docs = [
  "ipython>=7.31.1",
  "jupyter-book>=0.12.0,<2.0.0",
  "matplotlib",
  "networkx",
  "numba",
  "numpy",
  "pydicom>=3.0.2",
  "scipy",
  "sphinx-argparse",
  "sphinx-book-theme",
  "toml",
  "tqdm",
]

doctests = [
  "pytest>=8.4.0",
  "ruff",
  "sphinx-book-theme",
  "tabulate",
  "toml"
]

# comparables = [
#     "flashgamma",
# ]

cli = [
    "toml",
]

dicom = [
    "pydicom>=3.0.2",
    "pynetdicom>=3.0",
]

icom = [
    "numpy>=1.26",
]

mosaiq = [
    "attrs",
    "pandas>=1.0.0",
    "pymssql",
    "scikit-learn",
    "sqlalchemy>=2.0",
    "toml",
]

propagate = [
    "ruff",
]

# NOTE: [all] should be the union of every extra above.
# Consider generating this programmatically via propagate_extras() to prevent drift.
all = [
    "Pillow>=12.1.1",
    "PyYAML",
    "anthropic",
    "anyio",
    "astroid",
    "attrs",
    "dash>=3.0",
    "dbfread",
    "dicompyler-core",
    "doc8",
    "imageio[tifffile]",
    "ipython>=7.31.1",
    "jupyter-book>=0.12.0,<2.0.0",
    "keyring",
    "matplotlib",
    "natsort",
    "networkx",
    "numba",
    "numpy>=1.26",
    "packaging",
    "pandas>=1.0.0",
    "plotly",
    "pre-commit",
    "psutil",
    "pydicom>=3.0.2",
    "PyGithub",
    "pylibjpeg-libjpeg>=1.3.2",
    "pylint",
    "pymssql",
    "pynetdicom>=3.0",
    "pyright",
    "pytest>=8.4.0",
    "pytest-rerunfailures",
    "pytest-sugar",
    "pywin32; sys_platform == 'win32' and python_version >= '3.10' and python_version < '3.13'",
    "readme-renderer",
    "requests>=2.32.0",
    "rope",
    "ruff",
    "scikit-learn",
    "scipy",
    "shapely>=1.7.0",
    "sphinx-argparse",
    "sphinx-book-theme",
    "sqlalchemy>=2.0",
    "streamlit>=1.44.0,<2.0",
    "tabulate",
    "timeago",
    "toml",
    "tqdm",
    "trio",
    "trio-asyncio",
    "watchdog",
    "xmltodict",
]

[tool.pymedphys.extra-groups]
dev   = ["tests", "docs", "cli", "propagate"]
docs  = ["docs"]
user  = ["user"]
full  = ["user", "tests", "docs", "doctests", "cli", "dicom", "icom", "mosaiq"]

[dependency-groups]
dev = [
  "sphinx-external-toc>=1.0.1",
]

[tool.hatch.build]
include = ["lib/pymedphys/docs/_build/html/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["lib/pymedphys"]

[tool.ruff.lint]
extend-ignore = ["E741", "E722", "F401"]  # example: match your current settings

[tool.ruff.lint.isort]
known-third-party = ["pymedphys._imports"]
known-first-party = ["pymedphys"]


[tool.pyright]
include = ["lib/pymedphys"]
reportMissingImports = false
reportGeneralTypeIssues = false
reportUnboundVariable = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalCall = false
reportOptionalIterable = false
reportPrivateImportUsage = false
reportArgumentType = false
reportCallIssue = false
reportOperatorIssue = false
reportAttributeAccessIssue = false
reportAssignmentType = false
reportIndexIssue = false
reportReturnType = false
reportMissingModuleSource = false
reportTypedDictNotRequiredAccess = false

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"